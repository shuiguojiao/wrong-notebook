<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>智能错题本</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f8fd;
            color: #1f2747;
        }
        main { max-width: 360px; margin: 16px; padding: 32px 24px; text-align: center; background: #fff; border: 1px solid #c9d2e6; border-radius: 4px; box-shadow: 0 10px 18px -14px rgba(20,30,70,.5); }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 20px; margin: 24px 0 8px; }
        p { margin: 0 0 24px; color: #5a6385; line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        button, a {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 16px;
            color: #fff;
            background: #1f2747;
            font-family: inherit;
            cursor: pointer;
        }
        a { color: #2b3a8f; background: transparent; }
        button:focus-visible, a:focus-visible { outline: 2px solid #2b3a8f; outline-offset: 3px; }
        @media (prefers-color-scheme: dark) {
            body { background: #111b2e; color: #eef2fa; }
            main { background: #1b2940; border-color: #43536d; }
            p { color: #b8c3d9; }
            button { background: #dce5ff; color: #182238; }
            a { color: #b5c8ff; }
            button:focus-visible, a:focus-visible { outline-color: #b5c8ff; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1 id="title">网络开小差了，过一会儿再试</h1>
        <p id="message">先歇一会儿，网络恢复后继续。也可以回今天看看。</p>
        <nav>
            <button id="retry" type="button">重新加载</button>
            <a id="today" href="/">回今天</a>
        </nav>
    </main>
    <script>
        if (!/^zh/i.test(navigator.language || '')) {
            document.documentElement.lang = 'en';
            document.title = 'Wrong Notebook';
            document.getElementById('title').textContent = 'The network is taking a little break. Try again in a moment.';
            document.getElementById('message').textContent = 'Take a breather and continue when the network is back. You can also head back to today.';
            document.getElementById('retry').textContent = 'Reload';
            document.getElementById('today').textContent = 'Back to today';
        }
        document.getElementById('retry').addEventListener('click', function () {
            location.reload();
        });
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
